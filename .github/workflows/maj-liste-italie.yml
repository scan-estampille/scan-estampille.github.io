name: Mise à jour liste Italie
on:
  schedule:
    - cron: '0 5 1 * *'     # le 1er de chaque mois
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4

      - name: Télécharger et convertir
        run: python scripts/convert_it.py

      - name: Commit si la liste a changé
        run: |
          if [ -n "$(git status --porcelain ETAB_AGR_IT.txt)" ]; then
            sed -i "s/^\(const \)\?VERSION = .*/\1VERSION = '$(date +%Y-%m-%d)-it';/" sw.js
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add ETAB_AGR_IT.txt ETAB_AGR_IT.meta.json sw.js
            git commit -m "MAJ liste Italie ($(date +%Y-%m-%d))"
            git push
          else
            echo "Liste inchangée."
          fi
