name: Mise à jour liste Italie

on:
  schedule:
    - cron: '30 6 * * 1'    # chaque lundi à 6 h 30 UTC
    - cron: '30 6 * * 4'    # deuxième essai le jeudi, si le site était inaccessible lundi
  workflow_dispatch:         # bouton « Run workflow » pour lancer à la main
  push:                      # mise à jour manuelle : page enregistrée depuis un navigateur
    paths:
      - 'sources/italie.html'

permissions:
  contents: write

# Groupe commun aux workflows de listes : ils ne poussent jamais en même temps
concurrency:
  group: maj-listes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install requests beautifulsoup4

      # Mise à jour manuelle : la page déposée dans sources/ est utilisée telle quelle
      - name: Choisir la source
        id: source
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -f sources/italie.html ]; then
            echo "Page déposée à la main : sources/italie.html"
            echo "mode=manuel" >> "$GITHUB_OUTPUT"
          else
            echo "mode=auto" >> "$GITHUB_OUTPUT"
          fi

      # Le site du ministère est protégé par Gcore (vérification JavaScript) : il faut un vrai navigateur
      - name: Installer le navigateur automatique
        if: steps.source.outputs.mode == 'auto'
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium

      - name: Télécharger la page de la liste (navigateur automatique)
        if: steps.source.outputs.mode == 'auto'
        run: python scripts/fetch_it.py --out italie.html

      - name: Convertir
        id: convert
        run: |
          set -euo pipefail
          if [ "${{ steps.source.outputs.mode }}" = "manuel" ]; then
            INPUT=sources/italie.html
          elif [ -f italie.html ]; then
            INPUT=italie.html
          else
            # Page non obtenue : l'avertissement a déjà été affiché, la liste actuelle est conservée
            echo "done=non" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Conversion refusée (baisse suspecte, trop peu de lignes...) : la page reçue est gardée
          # dans debug/ pour être jointe au run et examinée
          python scripts/convert_it.py --input "$INPUT" || {
            mkdir -p debug && cp "$INPUT" debug/
            exit 1
          }
          echo "done=oui" >> "$GITHUB_OUTPUT"

      - name: Joindre la page reçue si la vérification ou la conversion échoue
        if: always() && hashFiles('debug/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: debug-italie
          path: debug/
          if-no-files-found: ignore

      - name: Enregistrer la liste si elle a changé
        if: steps.convert.outputs.done == 'oui'
        run: |
          set -euo pipefail
          rm -f italie.html
          # La page déposée à la main a servi : on la retire du dépôt
          if [ -f sources/italie.html ]; then git rm -q sources/italie.html; fi

          if [ -z "$(git status --porcelain ETAB_AGR_IT.txt)" ]; then
            echo "Liste inchangée."
            if [ -n "$(git status --porcelain sources)" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
              git commit -m "Retrait de la page italienne déposée (liste inchangée)"
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
              git push
            fi
            exit 0
          fi

          # Nouvelle version de l'appli : le service worker et l'appli portent la même valeur,
          # pour que les signalements indiquent la version réellement installée
          V="$(date -u +%Y-%m-%d)-it"
          sed -i "s/^\(const \)\?VERSION = .*/const VERSION = '$V';/" sw.js
          sed -i "s/^\(\s*const APP_VERSION = \)\".*\";/\1\"$V\";/" index.html
          grep -q "VERSION = '$V'" sw.js || { echo "::error::VERSION introuvable dans sw.js"; exit 1; }
          grep -q "APP_VERSION = \"$V\"" index.html || { echo "::error::APP_VERSION introuvable dans index.html"; exit 1; }

          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add ETAB_AGR_IT.txt ETAB_AGR_IT.meta.json sw.js index.html
          git commit -m "MAJ liste Italie ($(date -u +%Y-%m-%d))"
          # Un commit a pu arriver entre-temps (modification manuelle) : on se met à jour avant d'envoyer
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
